name: Config Server CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "config-server/**"
      - ".github/workflows/config-server-ci.yml"
      - ".github/workflows/reusable-java-service-ci.yml"

  push:
    branches:
      - main
    paths:
      - "config-server/**"
      - ".github/workflows/config-server-ci.yml"
      - ".github/workflows/reusable-java-service-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: config-server-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config-server:
    name: Config Server pipeline
    uses: ./.github/workflows/reusable-java-service-ci.yml

    with:
      service_directory: config-server
      service_name: config-server
      dockerhub_image_name: primecart-config-server
      dockerhub_username: ${{ vars.DOCKERHUB_USERNAME }}
      sonar_project_key: ${{ vars.SONAR_CONFIG_SERVER_PROJECT_KEY }}
      sonar_organization: ${{ vars.SONAR_ORGANIZATION }}
      java_version: "17"

    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}