name: Order Service CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "order-service/**"
      - ".github/workflows/order-service-ci.yml"
      - ".github/workflows/reusable-java-service-ci.yml"

  push:
    branches:
      - main
    paths:
      - "order-service/**"
      - ".github/workflows/order-service-ci.yml"
      - ".github/workflows/reusable-java-service-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: order-service-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  order-service:
    name: Order Service pipeline
    uses: ./.github/workflows/reusable-java-service-ci.yml

    with:
      service_directory: order-service
      service_name: order-service
      dockerhub_image_name: primecart-order-service
      dockerhub_username: ${{ vars.DOCKERHUB_USERNAME }}
      sonar_project_key: ${{ vars.SONAR_ORDER_SERVICE_PROJECT_KEY }}
      sonar_organization: ${{ vars.SONAR_ORGANIZATION }}
      java_version: "17"

    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}