# CI for Product Service
name: Product Service CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "product-service/**"
      - ".github/workflows/product-service-ci.yml"
      - ".github/workflows/reusable-java-service-ci.yml"

  push:
    branches:
      - main
    paths:
      - "product-service/**"
      - ".github/workflows/product-service-ci.yml"
      - ".github/workflows/reusable-java-service-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-service-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product-service:
    name: Product Service pipeline
    uses: ./.github/workflows/reusable-java-service-ci.yml

    with:
      service_directory: product-service
      service_name: product-service
      dockerhub_image_name: primecart-product-service
      dockerhub_username: ${{ vars.DOCKERHUB_USERNAME }}
      sonar_project_key: ${{ vars.SONAR_PROJECT_KEY }}
      sonar_organization: ${{ vars.SONAR_ORGANIZATION }}
      java_version: "17"

    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}