# CI for Product Service
name: Product Service CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "product-service/**"
      - ".github/workflows/product-service-ci.yml"

  push:
    branches:
      - main
    paths:
      - "product-service/**"
      - ".github/workflows/product-service-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-service-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test Product Service
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: product-service

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: product-service/pom.xml

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Verify with Maven
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: product-service-test-reports-${{ github.run_number }}
          path: product-service/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload packaged JAR
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: product-service-jar-${{ github.sha }}
          path: |
            product-service/target/*.jar
            !product-service/target/*.jar.original
          if-no-files-found: error
          retention-days: 7

  container-build-and-scan:
    name: Build and scan Product Service image
    needs:
      - build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download packaged JAR
        uses: actions/download-artifact@v7
        with:
          name: product-service-jar-${{ github.sha }}
          path: product-service/target

      - name: Build Docker image
        run: |
          docker build \
            --tag primecart/product-service:${{ github.sha }} \
            product-service

      - name: Display image details
        run: |
          docker image inspect \
            primecart/product-service:${{ github.sha }} \
            --format='Image={{.RepoTags}} Size={{.Size}} User={{.Config.User}}'

      - name: Scan image and create vulnerability report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: primecart/product-service:${{ github.sha }}
          format: json
          output: trivy-product-service.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          vuln-type: os,library
          ignore-unfixed: false
          exit-code: "0"

      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: product-service-vulnerability-report-${{ github.sha }}
          path: trivy-product-service.json
          if-no-files-found: error
          retention-days: 14

      - name: Display fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: primecart/product-service:${{ github.sha }}
          format: table
          severity: CRITICAL
          vuln-type: os,library
          ignore-unfixed: true
          exit-code: "0"
          skip-setup-trivy: true

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push image to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          SOURCE_IMAGE: primecart/product-service:${{ github.sha }}
        run: |
          SHA_IMAGE="${DOCKERHUB_USERNAME}/primecart-product-service:${{ github.sha }}"
          MAIN_IMAGE="${DOCKERHUB_USERNAME}/primecart-product-service:main"

          docker tag "${SOURCE_IMAGE}" "${SHA_IMAGE}"
          docker tag "${SOURCE_IMAGE}" "${MAIN_IMAGE}"

          docker push "${SHA_IMAGE}"
          docker push "${MAIN_IMAGE}"

          echo "Published ${SHA_IMAGE}"
          echo "Published ${MAIN_IMAGE}"