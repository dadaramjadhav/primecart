name: Product Service CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "product-service/**"
      - ".github/workflows/product-service-ci.yml"

  push:
    branches:
      - main
    paths:
      - "product-service/**"
      - ".github/workflows/product-service-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-service-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test Product Service
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: product-service

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: product-service/pom.xml

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Verify with Maven
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-service-test-reports-${{ github.run_number }}
          path: product-service/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload packaged JAR
        uses: actions/upload-artifact@v4
        with:
          name: product-service-jar-${{ github.sha }}
          path: |
            product-service/target/*.jar
            !product-service/target/*.jar.original
          if-no-files-found: error
          retention-days: 7