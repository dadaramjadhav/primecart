name: Customer Service CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "customer-service/**"
      - ".github/workflows/customer-service-ci.yml"
      - ".github/workflows/reusable-java-service-ci.yml"

  push:
    branches:
      - main
    paths:
      - "customer-service/**"
      - ".github/workflows/customer-service-ci.yml"
      - ".github/workflows/reusable-java-service-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: customer-service-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  customer-service:
    name: Customer Service pipeline
    uses: ./.github/workflows/reusable-java-service-ci.yml

    with:
      service_directory: customer-service
      service_name: customer-service
      dockerhub_image_name: primecart-customer-service
      dockerhub_username: ${{ vars.DOCKERHUB_USERNAME }}
      sonar_project_key: ${{ vars.SONAR_CUSTOMER_SERVICE_PROJECT_KEY }}
      sonar_organization: ${{ vars.SONAR_ORGANIZATION }}
      java_version: "17"

    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}