name: PrimeCart UI CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "primecart-ui/**"
      - ".github/workflows/primecart-ui-ci.yml"

  push:
    branches:
      - main
    paths:
      - "primecart-ui/**"
      - ".github/workflows/primecart-ui-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: primecart-ui-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-analyze:
    name: Build, lint and analyze PrimeCart UI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: primecart-ui

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: primecart-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build production frontend
        run: npm run build

      - name: Analyze with SonarQube Cloud
        if: >
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: primecart-ui
          args: >
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.projectKey=${{ vars.SONAR_UI_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.sources=src
            -Dsonar.exclusions=dist/**,node_modules/**,coverage/**
            -Dsonar.sourceEncoding=UTF-8

      - name: Upload frontend build
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: primecart-ui-dist-${{ github.sha }}
          path: primecart-ui/dist/
          if-no-files-found: error
          retention-days: 7

  container-build-and-scan:
    name: Build, scan and publish PrimeCart UI
    needs:
      - build-and-analyze
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: |
          docker build \
            --tag primecart/primecart-ui:${{ github.sha }} \
            primecart-ui

      - name: Display image details
        run: |
          docker image inspect \
            primecart/primecart-ui:${{ github.sha }} \
            --format='Image={{.RepoTags}} Size={{.Size}} User={{.Config.User}}'

      - name: Scan image and create vulnerability report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: primecart/primecart-ui:${{ github.sha }}
          format: json
          output: trivy-primecart-ui.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          vuln-type: os,library
          ignore-unfixed: false
          exit-code: "0"

      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: primecart-ui-vulnerability-report-${{ github.sha }}
          path: trivy-primecart-ui.json
          if-no-files-found: error
          retention-days: 14

      - name: Display fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: primecart/primecart-ui:${{ github.sha }}
          format: table
          severity: CRITICAL
          vuln-type: os,library
          ignore-unfixed: true
          exit-code: "0"
          skip-setup-trivy: true

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push image to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          SOURCE_IMAGE: primecart/primecart-ui:${{ github.sha }}
        run: |
          SHA_IMAGE="${DOCKERHUB_USERNAME}/primecart-ui:${{ github.sha }}"
          MAIN_IMAGE="${DOCKERHUB_USERNAME}/primecart-ui:main"

          docker tag "${SOURCE_IMAGE}" "${SHA_IMAGE}"
          docker tag "${SOURCE_IMAGE}" "${MAIN_IMAGE}"

          docker push "${SHA_IMAGE}"
          docker push "${MAIN_IMAGE}"

          echo "Published ${SHA_IMAGE}"
          echo "Published ${MAIN_IMAGE}"