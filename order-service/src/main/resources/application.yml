server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

spring:
  application:
    name: order-service
  config:
    import: ${SPRING_CONFIG_IMPORT:configserver:http://localhost:8888}

  cloud:
    config:
      label: ${CONFIG_GIT_DEFAULT_LABEL:main}

management:
  endpoints:
    web:
      exposure:
        include:
          - circuitbreakers
          - circuitbreakerevents

  health:
    circuitbreakers:
      enabled: true

logging:
  level:
    io.github.resilience4j.retry: DEBUG
    com.primecart.service.InventoryIntegrationService: DEBUG