apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: primecart-app
  labels:
    app.kubernetes.io/name: order-service
spec:
  selector:
    app.kubernetes.io/name: order-service
  ports:
    - name: http
      port: 8082
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: primecart-app
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  minReadySeconds: 10
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app.kubernetes.io/name: order-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-service
    spec:
      containers:
        - name: order-service
          image: dadaramjadhav/primecart-order-service
          imagePullPolicy: IfNotPresent

          env:
            - name: JAVA_TOOL_OPTIONS
              value: -Duser.home=/tmp

            - name: SPRING_CONFIG_IMPORT
              value: configserver:http://config-server:8888

            - name: CONFIG_GIT_DEFAULT_LABEL
              value: main

            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql.primecart-infra:3306/orders

            - name: SPRING_DATASOURCE_USERNAME
              value: primecart

            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: mysql-password

            - name: SPRING_RABBITMQ_HOST
              value: rabbitmq.primecart-infra

            - name: SPRING_RABBITMQ_PORT
              value: "5672"

            - name: SPRING_RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: rabbitmq-username

            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: rabbitmq-password

            - name: PRIMECART_CLIENTS_CART_SERVICE_URL
              value: http://cart-service:8083

            - name: PRIMECART_CLIENTS_INVENTORY_SERVICE_URL
              value: http://inventory-service:8084

            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
              value: https://auth.primecart.localhost/realms/primecart

            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI
              value: http://keycloak.primecart-infra:8080/realms/primecart/protocol/openid-connect/certs

            - name: SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_TOKEN_URI
              value: http://keycloak.primecart-infra:8080/realms/primecart/protocol/openid-connect/token

            - name: SPRING_BOOT_ADMIN_CLIENT_URL
              value: http://sb-admin-server:9191

            - name: SPRING_BOOT_ADMIN_CLIENT_USERNAME
              value: admin

            - name: SPRING_BOOT_ADMIN_CLIENT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: config-server-credentials
                  key: sba-password

            - name: SPRING_BOOT_ADMIN_CLIENT_INSTANCE_SERVICE_URL
              value: http://order-service:8082

            - name: SPRING_BOOT_ADMIN_CLIENT_INSTANCE_MANAGEMENT_URL
              value: http://order-service:8082/actuator

            - name: SPRING_BOOT_ADMIN_CLIENT_INSTANCE_HEALTH_URL
              value: http://order-service:8082/actuator/health

            - name: OTEL_SERVICE_NAME
              value: order-service

            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.primecart-observe:4318

            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf

            - name: MANAGEMENT_OTLP_TRACING_ENDPOINT
              value: http://otel-collector.primecart-observe:4318/v1/traces

            - name: LOGSTASH_DESTINATION
              value: logstash.primecart-observe:5000

            - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
              value: "true"

          lifecycle:
            preStop:
              exec:
                command: [ "sh", "-c", "sleep 10" ]

          ports:
            - name: http
              containerPort: 8082

          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi

          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: temporary-files
              mountPath: /tmp

      terminationGracePeriodSeconds: 45

      volumes:
        - name: temporary-files
          emptyDir: { }
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: order-service
  namespace: primecart-observe
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - primecart-app
  selector:
    matchLabels:
      app.kubernetes.io/name: order-service
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
      scrapeTimeout: 10s

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: order-service
  namespace: primecart-app
spec:
  minAvailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: order-service

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: order-service
  namespace: primecart-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: order-service
  minReplicas: 1
  maxReplicas: 1
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
