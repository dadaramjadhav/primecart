apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: primecart-app
  labels:
    app.kubernetes.io/name: api-gateway
spec:
  selector:
    app.kubernetes.io/name: api-gateway
  ports:
    - name: http
      port: 8181
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: primecart-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: dadaramjadhav/primecart-api-gateway
          imagePullPolicy: IfNotPresent
          env:
            - name: JAVA_TOOL_OPTIONS
              value: -Duser.home=/tmp

            - name: SPRING_CONFIG_IMPORT
              value: configserver:http://config-server:8888

            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
              value: http://auth.primecart.localhost/realms/primecart

            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI
              value: http://keycloak.primecart-infra:8080/realms/primecart/protocol/openid-connect/certs

            - name: SPRING_DATA_REDIS_HOST
              value: redis.primecart-infra

            - name: SPRING_DATA_REDIS_PORT
              value: "6379"

            - name: SPRING_DATA_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: redis-password

            - name: SPRING_BOOT_ADMIN_CLIENT_URL
              value: http://sb-admin-server:9191

            - name: SPRING_BOOT_ADMIN_CLIENT_USERNAME
              value: admin

            - name: SPRING_BOOT_ADMIN_CLIENT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: config-server-credentials
                  key: sba-password

            - name: SPRING_BOOT_ADMIN_CLIENT_INSTANCE_SERVICE_URL
              value: http://api-gateway:8181

            - name: SPRING_BOOT_ADMIN_CLIENT_INSTANCE_MANAGEMENT_URL
              value: http://api-gateway:8181/actuator

            - name: SPRING_BOOT_ADMIN_CLIENT_INSTANCE_HEALTH_URL
              value: http://api-gateway:8181/actuator/health

            - name: OTEL_SERVICE_NAME
              value: api-gateway

            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.primecart-observe:4318

            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf

            - name: MANAGEMENT_OTLP_TRACING_ENDPOINT
              value: http://otel-collector.primecart-observe:4318/v1/traces

            - name: LOGSTASH_DESTINATION
              value: logstash.primecart-observe:5000

            - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
              value: "true"

          ports:
            - name: http
              containerPort: 8181

          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: temporary-files
          emptyDir: { }

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: api-gateway
  namespace: primecart-observe
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - primecart-app

  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway

  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
      scrapeTimeout: 10s