apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: primecart-observe
data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 384
        spike_limit_mib: 64

      filter/drop_actuator:
        error_mode: ignore
        traces:
          span:
            - 'IsMatch(attributes["http.route"], "^/actuator(/.*)?$")'
            - 'IsMatch(attributes["url.path"], "^/actuator(/.*)?$")'
            - 'IsMatch(attributes["http.target"], "^/actuator(/.*)?$")'
      batch:
        timeout: 5s
        send_batch_size: 1024

    exporters:
      otlp/tempo:
        endpoint: tempo:4317
        tls:
          insecure: true

      prometheus:
        endpoint: 0.0.0.0:8889
        namespace: primecart
        send_timestamps: true

      debug:
        verbosity: basic

    service:
      extensions:
        - health_check

      pipelines:
        traces:
          receivers:
            - otlp
          processors:
            - memory_limiter
            - filter/drop_actuator
            - batch
          exporters:
            - otlp/tempo
            - debug

        metrics:
          receivers:
            - otlp
          processors:
            - memory_limiter
            - batch
          exporters:
            - prometheus
            - debug

        logs:
          receivers:
            - otlp
          processors:
            - memory_limiter
            - batch
          exporters:
            - debug

      telemetry:
        logs:
          level: info

        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: primecart-observe
  labels:
    app.kubernetes.io/name: otel-collector
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc

    - name: otlp-http
      port: 4318
      targetPort: otlp-http

    - name: health
      port: 13133
      targetPort: health

    - name: telemetry
      port: 8888
      targetPort: telemetry

    - name: prometheus
      port: 8889
      targetPort: prometheus
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: primecart-observe
  labels:
    app.kubernetes.io/name: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:latest
          imagePullPolicy: IfNotPresent
          args:
            - --config=/etc/otelcol-contrib/config.yaml

          ports:
            - name: otlp-grpc
              containerPort: 4317

            - name: otlp-http
              containerPort: 4318

            - name: health
              containerPort: 13133

            - name: telemetry
              containerPort: 8888

            - name: prometheus
              containerPort: 8889

          startupProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

          volumeMounts:
            - name: otel-collector-config
              mountPath: /etc/otelcol-contrib
              readOnly: true

      volumes:
        - name: otel-collector-config
          configMap:
            name: otel-collector-config
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: otel-collector
  namespace: primecart-observe
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector

  namespaceSelector:
    matchNames:
      - primecart-observe

  endpoints:
    - port: telemetry
      path: /metrics
      interval: 30s

    - port: prometheus
      path: /metrics
      interval: 30s