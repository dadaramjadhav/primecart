apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: primecart-infra
  labels:
    app.kubernetes.io/name: redis
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: primecart-infra
  labels:
    app.kubernetes.io/name: redis
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: redis
          image: redis:8.2-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
          args:
            - |
              exec redis-server \
                --appendonly yes \
                --appendfsync everysec \
                --requirepass "${REDIS_PASSWORD}"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: redis-password
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli --no-auth-warning -a "${REDIS_PASSWORD}" ping
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli --no-auth-warning -a "${REDIS_PASSWORD}" ping
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: redis-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: hostpath
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-insight-data
  namespace: primecart-infra
  labels:
    app.kubernetes.io/name: redis-insight
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: hostpath
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis-insight
  namespace: primecart-infra
  labels:
    app.kubernetes.io/name: redis-insight
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis-insight
  ports:
    - name: http
      port: 5540
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-insight
  namespace: primecart-infra
  labels:
    app.kubernetes.io/name: redis-insight
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-insight
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis-insight
    spec:
      containers:
        - name: redis-insight
          image: redis/redisinsight:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5540
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: redis-insight-data
              mountPath: /data
      volumes:
        - name: redis-insight-data
          persistentVolumeClaim:
            claimName: redis-insight-data
