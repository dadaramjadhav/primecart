apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: primecart-app
  labels:
    app.kubernetes.io/name: product-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: product-service
  ports:
    - name: http
      port: 8081
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: primecart-app
  labels:
    app.kubernetes.io/name: product-service
spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: product-service

  template:
    metadata:
      labels:
        app.kubernetes.io/name: product-service
    spec:
      securityContext:
        fsGroup: 999

      containers:
        - name: product-service
          image: primecart/product-service:local-v2
          imagePullPolicy: Never

          env:
            - name: JAVA_TOOL_OPTIONS
              value: -Duser.home=/tmp

            - name: SPRING_CONFIG_IMPORT
              value: configserver:http://config-server:8888

            - name: CONFIG_GIT_DEFAULT_LABEL
              value: main

            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql.primecart-infra:3306/product

            - name: SPRING_DATASOURCE_USERNAME
              value: primecart

            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: mysql-password

            - name: SPRING_RABBITMQ_HOST
              value: rabbitmq.primecart-infra

            - name: SPRING_RABBITMQ_PORT
              value: "5672"

            - name: SPRING_RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: rabbitmq-username

            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: rabbitmq-password

            - name: SPRING_DATA_REDIS_HOST
              value: redis.primecart-infra

            - name: SPRING_DATA_REDIS_PORT
              value: "6379"

            - name: SPRING_DATA_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: redis-password

            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
              value: http://localhost:8080/realms/primecart

            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI
              value: http://keycloak.primecart-infra:8080/realms/primecart/protocol/openid-connect/certs

            - name: AWS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: product-service-credentials
                  key: aws-access-key

            - name: AWS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: product-service-credentials
                  key: aws-secret-key

            - name: AWS_REGION
              value: eu-north-1

            - name: AWS_S3_BUCKET
              value: primecart-products

            - name: SBA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: config-server-credentials
                  key: sba-password

            - name: SPRING_BOOT_ADMIN_CLIENT_URL
              value: http://sb-admin-server:9191

            - name: SPRING_BOOT_ADMIN_CLIENT_USERNAME
              value: admin

            - name: SPRING_BOOT_ADMIN_CLIENT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: config-server-credentials
                  key: sba-password

            - name: SPRING_BOOT_ADMIN_CLIENT_INSTANCE_SERVICE_URL
              value: http://product-service:8081

            - name: SPRING_BOOT_ADMIN_CLIENT_INSTANCE_MANAGEMENT_URL
              value: http://product-service:8081/actuator

            - name: SPRING_BOOT_ADMIN_CLIENT_INSTANCE_HEALTH_URL
              value: http://product-service:8081/actuator/health

            - name: OTEL_SERVICE_NAME
              value: product-service

            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.primecart-observe:4318

            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf

            - name: MANAGEMENT_OTLP_TRACING_ENDPOINT
              value: http://otel-collector.primecart-observe:4318/v1/traces

            - name: OTEL_RESOURCE_ATTRIBUTES
              value: deployment.environment=local

            - name: LOGSTASH_DESTINATION
              value: logstash.primecart-observe:5000

            - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
              value: "true"

          ports:
            - name: http
              containerPort: 8081

          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi

          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: temporary-files
              mountPath: /tmp

      volumes:
        - name: temporary-files
          emptyDir: { }
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: product-service
  namespace: primecart-observe
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - primecart-app

  selector:
    matchLabels:
      app.kubernetes.io/name: product-service

  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s
