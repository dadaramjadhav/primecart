apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: primecart-app
  labels:
    app.kubernetes.io/name: payment-service
spec:
  selector:
    app.kubernetes.io/name: payment-service
  ports:
    - name: http
      port: 8085
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: primecart-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: payment-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payment-service
    spec:
      containers:
        - name: payment-service
          image: primecart/payment-service:local-v1
          imagePullPolicy: Never

          env:
            - name: JAVA_TOOL_OPTIONS
              value: -Duser.home=/tmp

            - name: SPRING_CONFIG_IMPORT
              value: configserver:http://config-server:8888

            - name: CONFIG_GIT_DEFAULT_LABEL
              value: main

            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql.primecart-infra:3306/payment

            - name: SPRING_DATASOURCE_USERNAME
              value: primecart

            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: mysql-password

            - name: SPRING_RABBITMQ_HOST
              value: rabbitmq.primecart-infra

            - name: SPRING_RABBITMQ_PORT
              value: "5672"

            - name: SPRING_RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: rabbitmq-username

            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: rabbitmq-password

            - name: PRIMECART_CLIENTS_ORDER_SERVICE_URL
              value: http://order-service:8082

            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
              value: http://localhost:8080/realms/primecart

            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI
              value: http://keycloak.primecart-infra:8080/realms/primecart/protocol/openid-connect/certs

            - name: SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_TOKEN_URI
              value: http://keycloak.primecart-infra:8080/realms/primecart/protocol/openid-connect/token
            - name: SPRING_BOOT_ADMIN_CLIENT_URL
              value: http://sb-admin-server:9191

            - name: SPRING_BOOT_ADMIN_CLIENT_USERNAME
              value: admin

            - name: SPRING_BOOT_ADMIN_CLIENT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: config-server-credentials
                  key: sba-password

            - name: SPRING_BOOT_ADMIN_CLIENT_INSTANCE_SERVICE_URL
              value: http://payment-service:8085

            - name: SPRING_BOOT_ADMIN_CLIENT_INSTANCE_MANAGEMENT_URL
              value: http://payment-service:8085/actuator

            - name: SPRING_BOOT_ADMIN_CLIENT_INSTANCE_HEALTH_URL
              value: http://payment-service:8085/actuator/health

            - name: OTEL_SERVICE_NAME
              value: payment-service

            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.primecart-observe:4318

            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf

            - name: MANAGEMENT_OTLP_TRACING_ENDPOINT
              value: http://otel-collector.primecart-observe:4318/v1/traces

            - name: LOGSTASH_DESTINATION
              value: logstash.primecart-observe:5000

            - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
              value: "true"

          ports:
            - name: http
              containerPort: 8085

          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi

          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: temporary-files
              mountPath: /tmp

      volumes:
        - name: temporary-files
          emptyDir: { }
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: payment-service
  namespace: primecart-observe
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - primecart-app
  selector:
    matchLabels:
      app.kubernetes.io/name: payment-service
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
      scrapeTimeout: 10s